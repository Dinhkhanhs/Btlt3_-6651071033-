<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Đăng ký tài khoản</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<main>
    <section>
        <h2>Đăng ký tài khoản mới</h2>
        
        <form action="xu_ly_dangky.php" method="POST" enctype="multipart/form-data" name="formDangKy" id="formDangKy">
            
            <fieldset>
                <legend>Thông tin cơ bản</legend>
                <div class="form-group">
                    <label for="hoten">Họ và tên:</label>
                    <input type="text" name="hoten" id="hoten" placeholder="Nguyễn Văn An" required maxlength="100" class="input-control">
                </div>
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" name="email" id="email" placeholder="example@gmail.com" required class="input-control">
                </div>
                <div class="form-group">
                    <label for="matkhau">Mật khẩu:</label>
                    <input type="password" name="matkhau" id="matkhau" minlength="8" required class="input-control">
                </div>
                <div class="form-group">
                    <label for="sdt">Số điện thoại:</label>
                    <input type="tel" name="sdt" id="sdt" pattern="[0-9]{10}" placeholder="0901234567" class="input-control">
                </div>
            </fieldset>

            <fieldset>
                <legend>Thông tin cá nhân</legend>
                <div class="form-group">
                    <label for="tuoi">Tuổi:</label>
                    <input type="number" name="tuoi" id="tuoi" min="16" max="99" step="1" value="18" class="input-control">
                </div>
                <div class="form-group">
                    <label for="ngaysinh">Ngày sinh:</label>
                    <input type="date" name="ngaysinh" id="ngaysinh" min="1950-01-01" max="2010-12-31" class="input-control">
                </div>
                <div class="form-group">
                    <label>Giới tính:</label>
                    <div class="radio-group">
                        <label><input type="radio" name="gioitinh" value="nam"> Nam</label>
                        <label><input type="radio" name="gioitinh" value="nu"> Nữ</label>
                        <label><input type="radio" name="gioitinh" value="khac"> Khác</label>
                    </div>
                </div>
                <div class="form-group">
                    <label for="mauua">Màu yêu thích:</label>
                    <input type="color" name="mauua" id="mauua" value="#FF6B6B">
                </div>
            </fieldset>

            <fieldset>
                <legend>Sở thích & Cài đặt</legend>
                <div class="form-group">
                    <label for="soikim">Tìm kiếm sở thích:</label>
                    <input type="search" name="soikim" id="soikim" placeholder="Ví dụ: đọc sách, chơi game..." class="input-control">
                </div>
                <div class="form-group">
                    <label for="chitieu">Mức chi tiêu/tháng (VNĐ):</label>
                    <input type="range" name="chitieu" id="chitieu" min="0" max="50000000" step="500000" value="5000000" class="input-control">
                </div>
                <div class="form-group">
                    <label>Sở thích (chọn nhiều):</label>
                    <div class="checkbox-group">
                        <label><input type="checkbox" name="st_docsinh" value="doc"> Đọc sách</label>
                        <label><input type="checkbox" name="st_game" value="game"> Chơi game</label>
                        <label><input type="checkbox" name="st_du_lich" value="dulich"> Du lịch</label>
                    </div>
                </div>
                <div class="form-group">
                    <label for="website">Website cá nhân:</label>
                    <input type="url" name="website" id="website" placeholder="https://example.com" class="input-control">
                </div>
                <div class="form-group">
                    <label for="avatar">Ảnh đại diện:</label>
                    <input type="file" name="avatar" id="avatar" accept="image/png, image/jpeg">
                </div>
            </fieldset>

            <div class="form-actions">
                <input type="submit" value="Đăng ký ngay">
                <input type="reset" value="Nhập lại">
            </div>

        </form>
    </section>
</main>

</body>
</html>
